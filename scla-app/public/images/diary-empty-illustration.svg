  <rect x="185" y="225" width="30" height="5" fill="#1E3A8A"/>
  
  <!-- Plant leaves -->
  <path d="M200 200 Q190 180 195 160" stroke="#60A5FA" stroke-width="3" fill="none"/>
  <path d="M200 200 Q210 180 205 160" stroke="#60A5FA" stroke-width="3" fill="none"/>
  <path d="M200 195 Q185 185 180 170" stroke="#93C5FD" stroke-width="2" fill="none"/>
  <circle cx="195" cy="160" r="8" fill="#60A5FA"/>
  <circle cx="205" cy="160" r="8" fill="#60A5FA"/>
  <circle cx="180" cy="170" r="6" fill="#93C5FD"/>
  
  <!-- Woman figure -->
